<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futura Studio | Experiência de Compra</title>
    <!-- Fontes Premium e Ícones -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Linha de Efeito de Luz Superior -->
    <div class="top-glow"></div>

    <!-- Interface Principal -->
    <div class="app-layout">
        
        <!-- Painel Lateral de Navegação e Filtros (Fixo) -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">F</div>
                <h2>Futura<span>Studio</span></h2>
            </div>

            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Buscar produto do futuro..." oninput="filtrarProdutos()">
            </div>

            <div class="filter-section">
                <h3>Categorias</h3>
                <ul class="filter-menu" id="categorias-menu">
                    <!-- Gerado por JS para escala futura -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <p>⚡ Powered by GitHub Pages</p>
            </div>
        </aside>

        <!-- Área Principal de Conteúdo -->
        <main class="main-content">
            
            <!-- Barra Superior Dinâmica -->
            <header class="topbar">
                <div class="welcome-text">
                    <h1>Coleção Exclusiva</h1>
                    <p>Produtos premium customizados sob demanda.</p>
                </div>
                
                <!-- Botão Flutuante do Carrinho de Alta Tecnologia -->
                <div class="cart-trigger" onclick="toggleCarrinho()">
                    <div class="cart-icon-wrapper">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span id="cart-count" class="badge">0</span>
                    </div>
                    <div class="cart-trigger-info">
                        <span>Sacola</span>
                        <b id="cart-total-trigger">R$ 0,00</b>
                    </div>
                </div>
            </header>

            <!-- Vitrine Infinita -->
            <section class="gallery-section">
                <div class="grid-gallery" id="produtos-vitrine">
                    <!-- Cards de Produtos Gerados Dinamicamente -->
                </div>
            </section>
        </main>
    </div>

    <!-- Gaveta do Carrinho Cinemática -->
    <div id="carrinho-lateral" class="glass-cart">
        <div class="cart-inner">
            <div class="cart-header">
                <h2>Seu Pedido</h2>
                <button class="close-cart" onclick="toggleCarrinho()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="cart-body" id="carrinho-itens-lista">
                <!-- Estado vazio inicial -->
                <div class="empty-state">
                    <i class="fa-solid fa-box-open"></i>
                    <p>Sua sacola está vazia.</p>
                    <span>Adicione itens para iniciar.</span>
                </div>
            </div>

            <div class="cart-footer">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="carrinho-total">R$ 0,00</span>
                </div>
                <div class="summary-line total">
                    <span>Total estimado</span>
                    <span id="carrinho-total-final">R$ 0,00</span>
                </div>
                <button class="btn-checkout" onclick="enviarPedidoWhatsApp()">
                    <span>Enviar para produção via WhatsApp</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
    <div id="overlay" class="blur-overlay" onclick="toggleCarrinho()"></div>

    <!-- Banco de Dados e Motor da Loja -->

            { id: 2, nome: "Camiseta Minimalist Heavyweight", preco: 49.90, img: "https://unsplash.com", cat: "Camisetas", desc: "Algodão premium 100%, caimento streetwear despojado." },

            { id: 4, nome: "Quadro em Azulejo Vitrificado", preco: 40.00, img: "https://unsplash.com", cat: "Quadros", desc: "Brilho espelhado de alta durabilidade com suporte premium." },
            { id: 5, nome: "Quadro MDF Minimalista", preco: 25.00, img: "https://unsplash.com", cat: "Quadros", desc: "Madeira ecológica texturizada pronta para fixação sem furos." },
            { id: 6, nome: "Squeeze Alumínio Escovado", preco: 39.90, img: "https://unsplash.com", cat: "Squeezes", desc: "Isolamento térmico leve, tampa com vedação a vácuo." }
        ];

        let carrinho = [];
        let categoriaAtiva = "Todos";

        // Inicializador do Sistema
        function init() {
            renderCategorias();
            renderProdutos();
        }

        // Gera o menu de filtros baseado nos produtos existentes (Inteligente)
        function renderCategorias() {
            const menu = document.getElementById('categorias-menu');
            const categoriasUnicas = ["Todos", ...new Set(produtos.map(p => p.cat))];
            
            menu.innerHTML = categoriasUnicas.map(cat => `
                <li class="${cat === categoriaAtiva ? 'active' : ''}" onclick="setCategoria('${cat}')">
                    <i class="fa-solid fa-chevron-right"></i> ${cat}
                </li>
            `).join('');
        }

        function setCategoria(cat) {
            categoriaAtiva = cat;
            renderCategorias();
            renderProdutos();
        }

        // Filtro duplo: Busca por texto + Categoria ativa
        function filtrarProdutos() {
            renderProdutos();
        }

        // Renderização dos cards holográficos/modernos
        function renderProdutos() {
            const vitrine = document.getElementById('produtos-vitrine');
            const termoBusca = document.getElementById('search-input').value.toLowerCase();

            const produtosFiltrados = produtos.filter(p => {
                const matchesCat = (categoriaAtiva === "Todos" || p.cat === categoriaAtiva);
                const matchesBusca = p.nome.toLowerCase().includes(termoBusca) || p.desc.toLowerCase().includes(termoBusca);
                return matchesCat && matchesBusca;
            });

            if (produtosFiltrados.length === 0) {
                vitrine.innerHTML = `<div class="no-results">Nenhum produto encontrado para sua busca.</div>`;
                return;
            }

            vitrine.innerHTML = produtosFiltrados.map(p => `
                <div class="glass-card-product">
                    <div class="image-wrapper">
                        <img src="${p.img}" alt="${p.nome}">
                        <div class="product-badge">${p.cat}</div>
                    </div>
                    <div class="content">
                        <h3>${p.nome}</h3>
                        <p>${p.desc}</p>
                        <div class="footer-row">
                            <span class="price">R$ ${p.preco.toFixed(2).replace('.', ',')}</span>
                            <button class="add-to-cart-btn" onclick="adicionarAoCarrinho(${p.id})">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Controle da Gaveta Lateral
        function toggleCarrinho() {
            document.getElementById('carrinho-lateral').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        // Adicionar Produto
        function adicionarAoCarrinho(id) {
            const produto = produtos.find(p => p.id === id);
            const itemNoCarrinho = carrinho.find(item => item.id === id);

            if (itemNoCarrinho) {
                itemNoCarrinho.quantidade++;

                carrinho.push({ ...produto, quantidade: 1 });

            const cartTrigger = document.querySelector('.cart-trigger');
            cartTrigger.classList.add('pulse');
            setTimeout(() => cartTrigger.classList.remove('pulse'), 300);
        }

            const item = carrinho.find(item => item.id === id);
            if (item) {
                item.quantidade += mod;
                if (item.quantidade <= 0) {
