<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lojinha de Personalizados</title>
    <!-- Link que conecta o HTML com o arquivo de estilo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎨 Loja de Personalizados</h1>
        <p>Escolha seu produto e finalize o pedido direto pelo WhatsApp!</p>
    </header>

    <div class="container" id="product-list">
        <!-- Os produtos vão aparecer aqui de forma automática através do JavaScript -->
    </div>

    <script>
        // 🚨 MUDE AQUI: Coloque seu número do WhatsApp (DDI + DDD + Número)
        const meuNumeroWhatsApp = "5541999999999"; 

        // Lista de produtos. Para mudar a foto, altere o "imagem: '...'"
        const produtos = [
            { id: 1, nome: "Caneca Personalizada", preco: 35.00, imagem: "caneca.jpg" },
            { id: 2, nome: "Camiseta Personalizada", preco: 50.00, imagem: "camiseta.jpg" },
            { id: 3, nome: "Chaveiro", preco: 15.00, imagem: "chaveiro.jpg" },
            { id: 4, nome: "Quadro em Azulejo", preco: 45.00, imagem: "azulejo.jpg" },
            { id: 5, nome: "Quadro MDF", preco: 40.00, imagem: "quadro_mdf.jpg" },
            { id: 6, nome: "Squeeze (Garrafinha)", preco: 40.00, imagem: "squeeze.jpg" },
            { id: 7, nome: "Chinelo Personalizado", preco: 35.00, imagem: "chinelo.jpg" },
            { id: 8, nome: "Almofada", preco: 45.00, imagem: "almofada.jpg" }
        ];

        const container = document.getElementById("product-list");

        // Cria o visual de cada produto na tela
        produtos.forEach(produto => {
            const card = document.createElement("div");
            card.classList.add("card");
            card.innerHTML = `
                <img src="${produto.imagem}" alt="${produto.nome}" class="product-img" onerror="this.src='https://placeholder.com'">
                <h3>${produto.nome}</h3>
                <div class="price">R$ ${produto.preco.toFixed(2)}</div>
                <div class="input-group">
                    <label for="qtd-${produto.id}">Qtd:</label>
                    <input type="number" id="qtd-${produto.id}" value="1" min="1">
                </div>
                <button onclick="comprar(${produto.id}, '${produto.nome}')">Comprar no WhatsApp</button>
            `;
            container.appendChild(card);
        });

        // Função que envia o cliente para o WhatsApp
        function comprar(id, nomeProduto) {
            const quantidade = document.getElementById(`qtd-${id}`).value;
            const mensagem = `Olá! Gostaria de comprar *${quantidade}x ${nomeProduto}*.`;
            const url = `https://whatsapp.com{meuNumeroWhatsApp}&text=${encodeURIComponent(mensagem)}`;
            window.open(url, '_blank');
        }
    </script>

</body>
</html>
