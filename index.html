<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Faturas de Veículos</title>
    <style>
        :root {
            --primary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #eef2f3;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary); }
        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: var(--light);
            border-radius: 6px;
        }
        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th { background-color: var(--primary); color: white; }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }
        .status-pago { background: var(--success); color: white; }
        .status-atrasado { background: var(--danger); color: white; }
        .status-pendente { background: var(--warning); color: #333; }
        .btn-delete { background: #666; padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Faturas de Veículos</h1>
    
    <!-- Formulário de Cadastro -->
    <form id="faturaForm">
        <input type="text" id="veiculo" placeholder="Veículo (Ex: Gol ABC-1234)" required>
        <input type="text" id="descricao" placeholder="Descrição (Ex: Seguro, Manutenção)" required>
        <input type="number" id="valor" placeholder="Valor (R\$)" step="0.01" required>
        <input type="date" id="vencimento" required>
        <select id="status">
            <option value="Pendente">Pendente</option>
            <option value="Pago">Pago</option>
        </select>
        <button type="submit">Adicionar</button>
    </form>

    <!-- Tabela de Dados -->
    <div style="overflow-x: auto;">
        <table>
            <thead>
                <tr>
                    <th>Veículo</th>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaCorpo">
                <!-- Linhas inseridas via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const form = document.getElementById('faturaForm');
    const tabela = document.getElementById('tabelaCorpo');

    // Carregar faturas salvas ou iniciar lista vazia
    let faturas = JSON.parse(localStorage.getItem('faturas_veiculos')) || [];

    function salvarDados() {
        localStorage.setItem('faturas_veiculos', JSON.stringify(faturas));
        renderizarTabela();
    }

    function renderizarTabela() {
        tabela.innerHTML = '';
        const hoje = new Date().toISOString().split('T')[0];

        faturas.forEach((fatura, index) => {
            let statusFinal = fatura.status;
            let classeStatus = 'status-pendente';

            // Validação de atraso automatizada
            if (fatura.status === 'Pendente' && fatura.vencimento < hoje) {
                statusFinal = 'Atrasado';
                classeStatus = 'status-atrasado';
            } else if (fatura.status === 'Pago') {
                classeStatus = 'status-pago';
            }

            // Formatar data para padrão brasileiro
            const dataFormatada = fatura.vencimento.split('-').reverse().join('/');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${fatura.veiculo}</b></td>
                <td>${fatura.descricao}</td>
                <td>R$ ${parseFloat(fatura.valor).toFixed(2)}</td>
                <td>${dataFormatada}</td>
                <td><span class="badge ${classeStatus}">${statusFinal}</span></td>
                <td>
                    ${fatura.status === 'Pendente' ? `<button onclick="marcarComoPago(\${index})" style="background:#2ecc71; padding:5px 10px; font-size:12px; margin-right:5px;">Pagar</button>` : ''}
                    <button class="btn-delete" onclick="removerFatura(${index})">Excluir</button>
                </td>
            `;
            tabela.appendChild(tr);
        });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const novaFatura = {
            veiculo: document.getElementById('veiculo').value,
            descricao: document.getElementById('descricao').value,
            valor: document.getElementById('valor').value,
            vencimento: document.getElementById('vencimento').value,
            status: document.getElementById('status').value
        };
        faturas.push(novaFatura);
        salvarDados();
        form.reset();
    });

    function marcarComoPago(index) {
        faturas[index].status = 'Pago';
        salvarDados();
    }

    function removerFatura(index) {
        if(confirm("Deseja realmente excluir este registro?")) {
            faturas.splice(index, 1);
            salvarDados();
        }
    }

    // Inicializar
    renderizarTabela();
</script>

</body>
</html>
